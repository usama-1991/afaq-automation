<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Brand Gradient -->
  <defs>
    <linearGradient id="ittisalo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#dc2626" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Modern Chat Bubble / App Icon Shape -->
  <path d="M424,120C424,84.7 395.3,56 360,56L152,56C116.7,56 88,84.7 88,120L88,344C88,379.3 116.7,408 152,408L312,408L405.3,474.9C415.8,482.5 431,475 431,462.1L424,120Z" 
        fill="url(#ittisalo-gradient)" 
        filter="url(#glow)"/>

  <!-- Stylized "I" / Connection Graphic -->
  <rect x="236" y="144" width="40" height="40" rx="20" fill="#ffffff" />
  <rect x="236" y="212" width="40" height="128" rx="20" fill="#ffffff" />
  
  <!-- Subtle networking dots to represent omnichannel connection -->
  <circle cx="160" cy="276" r="16" fill="#ffffff" opacity="0.6" />
  <circle cx="352" cy="276" r="16" fill="#ffffff" opacity="0.6" />
