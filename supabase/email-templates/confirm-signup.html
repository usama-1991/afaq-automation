<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify your email address</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      width: 100%;
      background-color: #f3f4f6;
      padding: 40px 16px;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      border: 1px solid #e5e7eb;
    }
    .header {
      padding: 32px 32px 16px 32px;
      text-align: center;
    }
    .content {
      padding: 16px 32px 32px 32px;
      color: #1f2937;
      font-size: 16px;
      line-height: 1.6;
    }
    .content p {
      margin: 0 0 20px 0;
      color: #374151;
    }
    .cta-container {
      text-align: center;
      margin: 32px 0 24px 0;
    }
    .btn {
      display: inline-block;
      background-color: #dc2626;
      color: #ffffff !important;
      font-weight: 600;
      font-size: 16px;
      line-height: 1;
      padding: 16px 32px;
      border-radius: 10px;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
    }
    .footer {
      background-color: #f9fafb;
      padding: 20px 32px;
      border-top: 1px solid #f3f4f6;
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="content" style="padding-top: 36px;">
        <p style="font-size: 16px; line-height: 1.6; color: #374151; margin-bottom: 24px;">
          Please verify your email address to activate your <strong>14-day full-access free trial</strong> and launch your workspace.
        </p>

        <div class="cta-container">
          <a href="{{ .ConfirmationURL }}" class="btn" target="_blank" rel="noopener noreferrer">
            Confirm Email &amp; Launch Workspace &rarr;
          </a>
        </div>
      </div>
      <div class="footer">
        If you did not request this account, please disregard this email.
      </div>
    </div>
  </div>
</body>
</html>
